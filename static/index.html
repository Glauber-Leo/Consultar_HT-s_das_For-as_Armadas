<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hotéis de Trânsito - Forças Armadas</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Estilização da barra de rolagem */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .leaflet-popup-content {
      margin: 0;
      line-height: 1.5;
    }
    /* Estilos para toques táteis */
    .touch-btn {
      min-height: 44px;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased h-screen flex flex-col overflow-hidden font-sans select-none md:select-auto">

  <!-- Toast / Alerta de Notificação Flutuante -->
  <div id="toastContainer" class="fixed top-4 left-4 right-4 md:left-auto md:right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-md"></div>

  <!-- Cabeçalho Principal (Mobile First) -->
  <header class="bg-slate-900 border-b border-slate-800 text-white px-3 sm:px-5 py-2.5 sm:py-3 shrink-0 shadow-md z-[600] flex items-center justify-between">
    <div class="flex items-center gap-2.5 sm:gap-3">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-emerald-600 flex items-center justify-center text-white shadow-inner shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 sm:w-5 sm:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-bold tracking-tight text-white leading-tight flex items-center gap-1.5">
          Hotéis de Trânsito FA
          <span class="text-[10px] hidden sm:inline-block bg-emerald-500/20 text-emerald-400 font-medium px-1.5 py-0.5 rounded border border-emerald-500/30">GeoPackage</span>
        </h1>
        <p class="text-[11px] text-slate-400 hidden sm:block">Busca geográfica e proximidade militar</p>
      </div>
    </div>

    <!-- Botões de Ação Rápida no Topo -->
    <div class="flex items-center gap-2">
      <button 
        id="btnVerTodos" 
        class="touch-btn text-xs bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-1.5 shadow-sm"
        title="Listar todos os hotéis sem filtro de distância"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
        </svg>
        <span class="hidden xs:inline sm:inline">Todos</span>
      </button>

      <button 
        id="btnMinhaLocalizacao" 
        class="touch-btn text-xs bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-medium px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 shadow-sm"
        title="Obter coordenadas do GPS"
      >
        <span id="iconeGps">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </span>
        <span id="textoGps" class="font-semibold">Meu Local</span>
      </button>
    </div>
  </header>

  <!-- Barra de Alternância de Abas Mobile (Visível apenas em smartphones/telas < md) -->
  <div class="flex md:hidden bg-white border-b border-slate-200 shrink-0 z-[550] shadow-sm">
    <button 
      id="tabBtnMapa" 
      class="flex-1 touch-btn py-2.5 text-center text-xs font-bold border-b-2 border-emerald-600 text-emerald-700 bg-emerald-50/50 flex items-center justify-center gap-1.5 transition"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
      </svg>
      <span>Mapa</span>
    </button>
    <button 
      id="tabBtnResultados" 
      class="flex-1 touch-btn py-2.5 text-center text-xs font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1.5 transition"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
      </svg>
      <span>Resultados</span>
      <span id="badgeContadorMobile" class="ml-1 px-1.5 py-0.2 bg-slate-200 text-slate-700 rounded-full text-[10px] font-bold">0</span>
    </button>
  </div>

  <!-- Painel de Filtros e Busca (Adaptável e Fluido) -->
  <div class="bg-white border-b border-slate-200 px-3 sm:px-4 py-2.5 sm:py-3 shrink-0 shadow-sm z-[500] relative">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center gap-2.5 sm:gap-3">
      
      <!-- Input de Município com Nominatim Autocomplete -->
      <div class="relative w-full max-w-xl">
        <div class="relative flex items-center w-full">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input 
            type="text" 
            id="inputMunicipio" 
            placeholder="Buscar município ou clicar no mapa..." 
            autocomplete="off"
            class="touch-btn w-full pl-9 pr-9 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition"
          >
          <button id="btnLimparBusca" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>

        <!-- Lista de Sugestões de Municípios (Dropdown com z-[1000]) -->
        <div id="listaSugestoes" class="hidden absolute left-0 top-full mt-1 w-full bg-white rounded-md shadow-xl border border-gray-200 overflow-hidden max-h-60 overflow-y-auto z-[1000] divide-y divide-slate-100"></div>
      </div>

      <!-- Controle de Raio em km -->
      <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 md:w-80">
        <span class="text-xs font-medium text-slate-600 shrink-0">Raio:</span>
        <input 
          type="range" 
          id="sliderRaio" 
          min="10" 
          max="500" 
          step="10" 
          value="100" 
          class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-600 touch-action-none"
        >
        <span id="valorRaioTexto" class="text-xs font-bold text-emerald-700 bg-white px-2 py-1 rounded border border-emerald-200 shrink-0 min-w-[58px] text-center">
          100 km
        </span>
      </div>

    </div>
  </div>

  <!-- Conteúdo Principal: Sidebar de Resultados e Mapa -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- Painel Lateral de Resultados (Desktop: à esquerda; Mobile: controlado por abas) -->
    <aside 
      id="painelResultados" 
      class="hidden md:flex w-full md:w-[420px] bg-white border-r border-slate-200 flex-col z-20 shadow-xl shrink-0 transition-all duration-200"
    >
      <!-- Cabeçalho da Sidebar -->
      <div class="px-4 py-2.5 bg-slate-100/90 border-b border-slate-200 flex items-center justify-between text-xs text-slate-600 shrink-0">
        <span id="labelStatus" class="font-medium">Carregando hotéis...</span>
        <span id="badgeFiltroAtivo" class="hidden text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
          Filtro Ativo
        </span>
      </div>

      <!-- Lista de Cards -->
      <div id="listaResultados" class="flex-1 overflow-y-auto p-3 space-y-2.5">
        <!-- Renderizado dinamicamente -->
      </div>
    </aside>

    <!-- Área do Mapa Leaflet -->
    <main id="painelMapa" class="flex-1 h-full w-full relative z-10">
      <div id="map" class="w-full h-full"></div>

      <!-- Card Flutuante de Referência Ativa -->
      <div id="boxPontoReferencia" class="hidden absolute top-3 right-3 left-3 sm:left-auto bg-white/95 backdrop-blur-md border border-slate-200 rounded-xl p-3 shadow-lg z-20 sm:max-w-xs text-xs">
        <div class="flex items-start justify-between gap-2">
          <div>
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <p class="font-bold text-slate-900 truncate" id="nomeRefMunicipio">Ponto de Referência</p>
            </div>
            <p class="text-slate-500 text-[11px] mt-0.5" id="coordsRef">Lat: --, Lon: --</p>
          </div>
          <button id="btnFecharRef" class="touch-btn text-slate-400 hover:text-slate-600 p-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>
    </main>

  </div>

  <script>
    // Estado Global da Aplicação
    const state = {
      abaAtivaMobile: 'mapa', // 'mapa' ou 'resultados'
      pontoCentral: null,     // { lat: number, lon: number, nome: string }
      raioKm: 100,
      hoteisFiltrados: [],
      marcadoresHoteis: [],
      marcadorCentro: null,
      circuloRaio: null
    };

    // Inicialização do Mapa Leaflet
    const map = L.map('map', {
      center: [-14.235, -51.9253],
      zoom: 4,
      zoomControl: false
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Camada Base OpenStreetMap Oficial
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    // Ícones personalizados
    const iconeHotel = L.divIcon({
      className: 'custom-hotel-marker',
      html: `
        <div class="w-8 h-8 rounded-full bg-emerald-600 border-2 border-white shadow-lg flex items-center justify-center text-white transform hover:scale-110 transition cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
        </div>
      `,
      iconSize: [32, 32],
      iconAnchor: [16, 16],
      popupAnchor: [0, -18]
    });

    const iconeCentro = L.divIcon({
      className: 'custom-center-marker',
      html: `
        <div class="w-8 h-8 rounded-full bg-rose-600 border-2 border-white shadow-xl flex items-center justify-center text-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
          </svg>
        </div>
      `,
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -32]
    });

    // Elementos DOM
    const inputMunicipio = document.getElementById('inputMunicipio');
    const btnLimparBusca = document.getElementById('btnLimparBusca');
    const listaSugestoes = document.getElementById('listaSugestoes');
    const sliderRaio = document.getElementById('sliderRaio');
    const valorRaioTexto = document.getElementById('valorRaioTexto');
    const painelResultados = document.getElementById('painelResultados');
    const painelMapa = document.getElementById('painelMapa');
    const listaResultados = document.getElementById('listaResultados');
    const labelStatus = document.getElementById('labelStatus');
    const badgeFiltroAtivo = document.getElementById('badgeFiltroAtivo');
    const badgeContadorMobile = document.getElementById('badgeContadorMobile');
    const btnVerTodos = document.getElementById('btnVerTodos');
    const btnMinhaLocalizacao = document.getElementById('btnMinhaLocalizacao');
    const textoGps = document.getElementById('textoGps');
    const iconeGps = document.getElementById('iconeGps');
    const boxPontoReferencia = document.getElementById('boxPontoReferencia');
    const nomeRefMunicipio = document.getElementById('nomeRefMunicipio');
    const coordsRef = document.getElementById('coordsRef');
    const btnFecharRef = document.getElementById('btnFecharRef');
    const tabBtnMapa = document.getElementById('tabBtnMapa');
    const tabBtnResultados = document.getElementById('tabBtnResultados');
    const toastContainer = document.getElementById('toastContainer');

    // Função de Exibição de Alertas / Toasts Amigáveis
    function exibirToast(mensagem, tipo = 'erro') {
      const toast = document.createElement('div');
      toast.className = `p-3.5 rounded-xl shadow-xl text-xs font-medium border flex items-center justify-between gap-3 pointer-events-auto transition transform duration-300 translate-y-2 opacity-0 ${
        tipo === 'erro' 
          ? 'bg-rose-50 border-rose-200 text-rose-800' 
          : 'bg-emerald-50 border-emerald-200 text-emerald-800'
      }`;

      toast.innerHTML = `
        <div class="flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 ${tipo === 'erro' ? 'text-rose-600' : 'text-emerald-600'}" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          <span>${mensagem}</span>
        </div>
        <button class="text-slate-400 hover:text-slate-600 p-1">✕</button>
      `;

      toast.querySelector('button').addEventListener('click', () => {
        toast.remove();
      });

      toastContainer.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        if (toast.parentElement) {
          toast.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => toast.remove(), 300);
        }
      }, 6000);
    }

    // Alternância de Abas no Mobile
    function alternarAbaMobile(aba) {
      state.abaAtivaMobile = aba;
      if (window.innerWidth < 768) {
        if (aba === 'mapa') {
          painelResultados.classList.add('hidden');
          painelMapa.classList.remove('hidden');
          tabBtnMapa.className = "flex-1 touch-btn py-2.5 text-center text-xs font-bold border-b-2 border-emerald-600 text-emerald-700 bg-emerald-50/50 flex items-center justify-center gap-1.5 transition";
          tabBtnResultados.className = "flex-1 touch-btn py-2.5 text-center text-xs font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1.5 transition";
          setTimeout(() => map.invalidateSize(), 150);
        } else {
          painelMapa.classList.add('hidden');
          painelResultados.classList.remove('hidden');
          tabBtnResultados.className = "flex-1 touch-btn py-2.5 text-center text-xs font-bold border-b-2 border-emerald-600 text-emerald-700 bg-emerald-50/50 flex items-center justify-center gap-1.5 transition";
          tabBtnMapa.className = "flex-1 touch-btn py-2.5 text-center text-xs font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1.5 transition";
        }
      } else {
        painelResultados.classList.remove('hidden');
        painelMapa.classList.remove('hidden');
        setTimeout(() => map.invalidateSize(), 150);
      }
    }

    tabBtnMapa.addEventListener('click', () => alternarAbaMobile('mapa'));
    tabBtnResultados.addEventListener('click', () => alternarAbaMobile('resultados'));
    window.addEventListener('resize', () => alternarAbaMobile(state.abaAtivaMobile));

    // Funções Utilitárias para Atributos dos Hotéis
    function obterPropriedade(obj, campos) {
      for (const campo of campos) {
        for (const chave in obj) {
          if (chave.toLowerCase() === campo.toLowerCase() && obj[chave] !== null && obj[chave] !== '') {
            return obj[chave];
          }
        }
      }
      return null;
    }

    function obterNomeHotel(hotel) {
      return obterPropriedade(hotel, ['nome', 'hotel', 'denominacao', 'estabelecimento', 'nome_hotel', 'ht']) || 'Hotel de Trânsito';
    }

    function obterCidadeUf(hotel) {
      const cidade = obterPropriedade(hotel, ['municipio', 'cidade', 'localidade', 'cid']) || '';
      const uf = obterPropriedade(hotel, ['uf', 'estado', 'sigla_uf']) || '';
      if (cidade && uf) return `${cidade} - ${uf}`;
      return cidade || uf || 'Localidade não informada';
    }

    function obterForca(hotel) {
      return obterPropriedade(hotel, ['forca', 'forca_armada', 'comando', 'organizacao', 'om']) || 'Forças Armadas';
    }

    // Consulta à API com cálculo de distância e raio
    async function carregarHoteis(lat = null, lon = null, raio = null) {
      labelStatus.textContent = "Buscando dados no GeoPackage...";
      listaResultados.innerHTML = `
        <div class="flex flex-col items-center justify-center p-8 text-slate-400">
          <svg class="animate-spin h-7 w-7 text-emerald-600 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-xs">Consultando banco de dados...</span>
        </div>
      `;

      try {
        let url = '/api/hoteis';
        const params = new URLSearchParams();
        if (lat !== null && lon !== null) {
          params.append('lat', lat);
          params.append('lon', lon);
          if (raio) params.append('raio_km', raio);
        }

        if ([...params.keys()].length > 0) {
          url += `?${params.toString()}`;
        }

        const resposta = await fetch(url);
        if (!resposta.ok) throw new Error("Falha ao comunicar com a API");
        const dados = await resposta.json();

        state.hoteisFiltrados = dados.hoteis || [];
        renderizarLista(state.hoteisFiltrados);
        atualizarMarcadoresMapa(state.hoteisFiltrados);

        badgeContadorMobile.textContent = state.hoteisFiltrados.length;

        if (lat !== null && lon !== null) {
          badgeFiltroAtivo.classList.remove('hidden');
          labelStatus.textContent = `${state.hoteisFiltrados.length} hotéis no raio de ${raio} km`;
        } else {
          badgeFiltroAtivo.classList.add('hidden');
          labelStatus.textContent = `Total: ${state.hoteisFiltrados.length} hotéis cadastrados`;
        }

      } catch (erro) {
        console.error("Erro ao carregar hotéis:", erro);
        labelStatus.textContent = "Erro ao carregar dados";
        exibirToast("Erro ao carregar hotéis do banco GeoPackage.");
        listaResultados.innerHTML = `
          <div class="p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 text-xs text-center">
            Não foi possível carregar os dados. Verifique a conexão com o servidor.
          </div>
        `;
      }
    }

    // Renderização dos cards de resultados
    function renderizarLista(hoteis) {
      if (!hoteis || hoteis.length === 0) {
        listaResultados.innerHTML = `
          <div class="text-center py-10 px-4">
            <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mx-auto text-slate-400 mb-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <p class="text-sm font-semibold text-slate-700">Nenhum hotel encontrado</p>
            <p class="text-xs text-slate-500 mt-1">Aumente o raio de busca ou selecione outro município.</p>
          </div>
        `;
        return;
      }

      listaResultados.innerHTML = '';
      hoteis.forEach((hotel) => {
        const nome = obterNomeHotel(hotel);
        const cidadeUf = obterCidadeUf(hotel);
        const forca = obterForca(hotel);
        const distancia = hotel.distancia_km !== undefined ? `${hotel.distancia_km} km` : null;
        const lat = hotel.latitude;
        const lon = hotel.longitude;

        const card = document.createElement('div');
        card.className = "touch-btn bg-white p-3.5 rounded-xl border border-slate-200/90 active:bg-slate-50 hover:border-emerald-500/70 hover:shadow-md transition cursor-pointer group";
        
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <h3 class="text-sm font-semibold text-slate-800 group-hover:text-emerald-700 transition line-clamp-1">
              ${nome}
            </h3>
            ${distancia ? `
              <span class="shrink-0 bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-bold px-2 py-0.5 rounded-full">
                ${distancia}
              </span>
            ` : ''}
          </div>

          <div class="mt-1 flex items-center gap-1.5 text-xs text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span class="truncate">${cidadeUf}</span>
          </div>

          <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
            <span class="inline-block bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium truncate max-w-[190px]">
              ${forca}
            </span>
            <span class="text-emerald-600 font-semibold flex items-center gap-1">
              Ver no mapa
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
              </svg>
            </span>
          </div>
        `;

        card.addEventListener('click', () => {
          if (lat !== null && lon !== null) {
            // Em smartphone, muda para a aba mapa automaticamente
            if (window.innerWidth < 768) {
              alternarAbaMobile('mapa');
            }

            setTimeout(() => {
              map.flyTo([lat, lon], 14, { duration: 1.0 });
              const marcador = state.marcadoresHoteis.find(m => m._hotelRef === hotel);
              if (marcador) marcador.openPopup();
            }, 100);
          }
        });

        listaResultados.appendChild(card);
      });
    }

    // Conteúdo formatado para o popup do Leaflet
    function criarConteudoPopup(hotel) {
      const nome = obterNomeHotel(hotel);
      const cidadeUf = obterCidadeUf(hotel);
      const forca = obterForca(hotel);
      const distancia = hotel.distancia_km !== undefined ? `${hotel.distancia_km} km` : null;

      let linhasExtras = '';
      for (const [chave, valor] of Object.entries(hotel)) {
        const chaveMin = chave.toLowerCase();
        if (['latitude', 'longitude', 'distancia_km'].includes(chaveMin)) continue;
        if (valor !== null && valor !== '') {
          linhasExtras += `
            <div class="flex justify-between py-1 border-b border-slate-100 text-[11px]">
              <span class="text-slate-400 font-medium capitalize">${chave.replace(/_/g, ' ')}:</span>
              <span class="text-slate-700 font-semibold text-right pl-2 truncate max-w-[180px]">${valor}</span>
            </div>
          `;
        }
      }

      return `
        <div class="p-3.5 max-w-xs font-sans">
          <div class="flex items-start justify-between gap-2 mb-1.5">
            <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded uppercase tracking-wider">
              ${forca}
            </span>
            ${distancia ? `
              <span class="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                ${distancia}
              </span>
            ` : ''}
          </div>
          <h4 class="text-sm font-bold text-slate-900 leading-snug mb-0.5">${nome}</h4>
          <p class="text-xs text-slate-500 mb-2.5">${cidadeUf}</p>

          <div class="max-h-36 overflow-y-auto pr-1">
            ${linhasExtras}
          </div>

          <div class="mt-3 pt-2 text-center">
            <a 
              href="https://www.google.com/maps/search/?api=1&query=${hotel.latitude},${hotel.longitude}" 
              target="_blank" 
              class="touch-btn inline-flex items-center justify-center gap-1.5 text-xs text-white bg-slate-900 hover:bg-slate-800 active:bg-slate-700 px-3.5 py-2 rounded-lg transition shadow-sm w-full font-medium"
            >
              Rota no Google Maps
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
              </svg>
            </a>
          </div>
        </div>
      `;
    }

    // Atualização de marcadores no mapa
    function atualizarMarcadoresMapa(hoteis) {
      state.marcadoresHoteis.forEach(m => map.removeLayer(m));
      state.marcadoresHoteis = [];

      const limites = [];

      hoteis.forEach(hotel => {
        if (hotel.latitude !== null && hotel.longitude !== null) {
          const lat = hotel.latitude;
          const lon = hotel.longitude;
          limites.push([lat, lon]);

          const marcador = L.marker([lat, lon], { icon: iconeHotel })
            .bindPopup(criarConteudoPopup(hotel), {
              autoPan: true,
              autoPanPadding: [20, 20]
            });
          
          marcador._hotelRef = hotel;

          // Evento de clique para centralizar suavemente no marcador e garantir popup visível no smartphone
          marcador.on('click', function(e) {
            const coords = e.target.getLatLng();
            const zoomAtual = map.getZoom();
            const zoomAlvo = zoomAtual < 13 ? 13 : zoomAtual;
            map.setView(coords, zoomAlvo, { animate: true });
            e.target.openPopup();
          });

          marcador.addTo(map);
          state.marcadoresHoteis.push(marcador);
        }
      });

      if (state.pontoCentral) {
        limites.push([state.pontoCentral.lat, state.pontoCentral.lon]);
      }

      if (limites.length > 0 && !state.pontoCentral) {
        map.fitBounds(limites, { padding: [30, 30], maxZoom: 14 });
      }
    }

    // Círculo e Marcador do Ponto de Busca
    function atualizarRaioMapa() {
      if (state.circuloRaio) map.removeLayer(state.circuloRaio);
      if (state.marcadorCentro) map.removeLayer(state.marcadorCentro);

      if (!state.pontoCentral) {
        boxPontoReferencia.classList.add('hidden');
        return;
      }

      const { lat, lon, nome } = state.pontoCentral;

      state.circuloRaio = L.circle([lat, lon], {
        radius: state.raioKm * 1000,
        color: '#059669',
        fillColor: '#10b981',
        fillOpacity: 0.12,
        weight: 2,
        dashArray: '5, 5'
      }).addTo(map);

      state.marcadorCentro = L.marker([lat, lon], { icon: iconeCentro })
        .bindPopup(`
          <div class="p-2.5 text-xs">
            <p class="font-bold text-slate-800">${nome || 'Ponto de Referência'}</p>
            <p class="text-slate-500">Raio de busca: ${state.raioKm} km</p>
          </div>
        `, {
          autoPan: true,
          autoPanPadding: [20, 20]
        });

      state.marcadorCentro.on('click', function(e) {
        map.panTo(e.target.getLatLng(), { animate: true });
        e.target.openPopup();
      });

      state.marcadorCentro.addTo(map);

      nomeRefMunicipio.textContent = nome || 'Referência Selecionada';
      coordsRef.textContent = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
      boxPontoReferencia.classList.remove('hidden');

      map.fitBounds(state.circuloRaio.getBounds(), { padding: [25, 25] });
    }

    // Aplicação do filtro
    function aplicarFiltroGeografico() {
      if (state.pontoCentral) {
        atualizarRaioMapa();
        carregarHoteis(state.pontoCentral.lat, state.pontoCentral.lon, state.raioKm);
      } else {
        carregarHoteis();
      }
    }

    // Controle do Slider de Raio
    sliderRaio.addEventListener('input', (e) => {
      state.raioKm = parseInt(e.target.value, 10);
      valorRaioTexto.textContent = `${state.raioKm} km`;
    });

    sliderRaio.addEventListener('change', () => {
      if (state.pontoCentral) {
        aplicarFiltroGeografico();
      }
    });

    // Campo de busca com Nominatim (OpenStreetMap)
    let timerBusca = null;
    inputMunicipio.addEventListener('input', (e) => {
      const termo = e.target.value.trim();
      btnLimparBusca.classList.toggle('hidden', termo.length === 0);

      clearTimeout(timerBusca);
      if (termo.length < 3) {
        listaSugestoes.classList.add('hidden');
        return;
      }

      timerBusca = setTimeout(async () => {
        try {
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(termo)}&countrycodes=br&limit=5`;
          const resp = await fetch(url, {
            headers: { 'Accept-Language': 'pt-BR' }
          });
          const resultados = await resp.json();

          if (resultados && resultados.length > 0) {
            listaSugestoes.innerHTML = '';
            resultados.forEach(item => {
              const itemDiv = document.createElement('div');
              itemDiv.className = 'item-sugestao touch-btn p-3 text-xs text-slate-700 hover:bg-emerald-50 active:bg-emerald-100 cursor-pointer flex items-center gap-2.5 transition';
              itemDiv.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span class="truncate">${item.display_name}</span>
              `;

              itemDiv.addEventListener('click', () => {
                inputMunicipio.value = item.display_name.split(',')[0];
                listaSugestoes.classList.add('hidden');
                
                state.pontoCentral = {
                  lat: parseFloat(item.lat),
                  lon: parseFloat(item.lon),
                  nome: item.display_name.split(',')[0]
                };

                aplicarFiltroGeografico();
              });

              listaSugestoes.appendChild(itemDiv);
            });
            listaSugestoes.classList.remove('hidden');
          } else {
            listaSugestoes.classList.add('hidden');
          }
        } catch (err) {
          console.error("Erro na busca Nominatim:", err);
        }
      }, 350);
    });

    // Fechamento inteligente do dropdown via teclado (Enter / Escape)
    inputMunicipio.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const primeiraSugestao = listaSugestoes.querySelector('.item-sugestao');
        if (primeiraSugestao && !listaSugestoes.classList.contains('hidden')) {
          primeiraSugestao.click();
        }
        listaSugestoes.classList.add('hidden');
      } else if (e.key === 'Escape') {
        listaSugestoes.classList.add('hidden');
      }
    });

    // Fechamento ao clicar em qualquer outra parte da tela
    document.addEventListener('click', (e) => {
      const wrapperBusca = inputMunicipio.closest('.relative');
      if (!wrapperBusca || !wrapperBusca.contains(e.target)) {
        listaSugestoes.classList.add('hidden');
      }
    });

    function resetarParaTodos() {
      inputMunicipio.value = '';
      btnLimparBusca.classList.add('hidden');
      listaSugestoes.classList.add('hidden');
      state.pontoCentral = null;
      atualizarRaioMapa();
      carregarHoteis();
    }

    btnLimparBusca.addEventListener('click', resetarParaTodos);
    btnFecharRef.addEventListener('click', resetarParaTodos);
    btnVerTodos.addEventListener('click', resetarParaTodos);

    // ========================================================
    // GEOLOCALIZAÇÃO OTIMIZADA PARA DISPOSITIVOS MÓVEIS (GPS)
    // ========================================================
    btnMinhaLocalizacao.addEventListener('click', () => {
      if (!('geolocation' in navigator)) {
        exibirToast("Seu dispositivo ou navegador não suporta geolocalização.", "erro");
        return;
      }

      // Feedback visual de carregamento
      btnMinhaLocalizacao.disabled = true;
      btnMinhaLocalizacao.classList.add('opacity-80', 'cursor-wait');
      iconeGps.innerHTML = `
        <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      `;
      textoGps.textContent = "Localizando...";

      // Parâmetros precisos para navegadores em smartphones
      const opcoesGeo = {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      };

      navigator.geolocation.getCurrentPosition(
        (posicao) => {
          // Restaura botão
          btnMinhaLocalizacao.disabled = false;
          btnMinhaLocalizacao.classList.remove('opacity-80', 'cursor-wait');
          iconeGps.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          `;
          textoGps.textContent = "Meu Local";

          const lat = posicao.coords.latitude;
          const lon = posicao.coords.longitude;

          // Atualiza estado e input
          state.pontoCentral = {
            lat: lat,
            lon: lon,
            nome: 'Minha Localização (GPS)'
          };
          inputMunicipio.value = 'Minha Localização (GPS)';
          btnLimparBusca.classList.remove('hidden');

          exibirToast("Localização GPS obtida com sucesso!", "sucesso");

          // Centraliza o mapa e desenha o círculo do raio
          atualizarRaioMapa();

          // Se estiver na aba de resultados no celular, muda para mapa para visualizar
          if (window.innerWidth < 768 && state.abaAtivaMobile === 'resultados') {
            alternarAbaMobile('mapa');
          }

          // Executa automaticamente a consulta na API com lat, lon e raio_km
          carregarHoteis(lat, lon, state.raioKm);
        },
        (erro) => {
          // Restaura botão
          btnMinhaLocalizacao.disabled = false;
          btnMinhaLocalizacao.classList.remove('opacity-80', 'cursor-wait');
          iconeGps.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          `;
          textoGps.textContent = "Meu Local";

          let msgErro = "Não foi possível obter a sua localização.";
          switch (erro.code) {
            case erro.PERMISSION_DENIED:
              msgErro = "Acesso à localização negado. Permita o acesso ao GPS nas configurações do seu navegador ou aparelho.";
              break;
            case erro.POSITION_UNAVAILABLE:
              msgErro = "Sinal de GPS indisponível. Verifique se a localização está ativada no seu aparelho.";
              break;
            case erro.TIMEOUT:
              msgErro = "Tempo esgotado ao tentar obter o GPS. Tente novamente em uma área aberta ou com melhor sinal.";
              break;
          }

          console.warn("Erro de geolocalização:", erro);
          exibirToast(msgErro, "erro");
        },
        opcoesGeo
      );
    });

    // Clique direto no mapa para definir referência
    map.on('click', (e) => {
      state.pontoCentral = {
        lat: e.latlng.lat,
        lon: e.latlng.lng,
        nome: `Ponto no Mapa (${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)})`
      };
      inputMunicipio.value = state.pontoCentral.nome;
      btnLimparBusca.classList.remove('hidden');
      aplicarFiltroGeografico();
    });

    // Carga inicial
    carregarHoteis();
  </script>
</body>
</html>
