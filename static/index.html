<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotéis de Trânsito - Forças Armadas</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            militar: {
              50: '#f4f6f3',
              100: '#e5eae2',
              500: '#345235',
              600: '#2b442c',
              700: '#223623',
              800: '#1a291b',
              900: '#131e14',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Estilização customizada da barra de rolagem */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    .leaflet-popup-content {
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-screen flex flex-col overflow-hidden font-sans">

  <!-- Cabeçalho Principal -->
  <header class="bg-slate-900 border-b border-slate-800 text-white px-5 py-3.5 flex items-center justify-between shrink-0 shadow-md z-30">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-emerald-600 flex items-center justify-center text-white shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
          Hotéis de Trânsito das Forças Armadas
          <span class="text-xs bg-emerald-500/20 text-emerald-400 font-medium px-2 py-0.5 rounded border border-emerald-500/30">GeoPackage</span>
        </h1>
        <p class="text-xs text-slate-400">Localização e busca geográfica por proximidade em tempo real</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="btnVerTodos" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
        </svg>
        Listar Todos
      </button>
      <button id="btnMinhaLocalizacao" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Meu Local
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal com Sidebar e Mapa -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- Sidebar de Controles e Resultados -->
    <aside class="w-full md:w-[440px] bg-white border-r border-slate-200 flex flex-col z-20 shadow-xl shrink-0 transition-all duration-300">
      
      <!-- Painel de Filtros e Busca -->
      <div class="p-4 bg-slate-50/70 border-b border-slate-200 space-y-3.5">
        
        <!-- Campo de Busca por Município -->
        <div>
          <label for="inputMunicipio" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">
            Buscar Município / Localidade
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            </div>
            <input 
              type="text" 
              id="inputMunicipio" 
              placeholder="Ex: Rio de Janeiro, Brasília, Manaus..." 
              autocomplete="off"
              class="w-full pl-9 pr-9 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 shadow-sm transition"
            >
            <button id="btnLimparBusca" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>

          <!-- Sugestões de Municípios (Nominatim Geocoding) -->
          <div id="listaSugestoes" class="hidden absolute left-4 right-4 md:left-4 md:w-[408px] mt-1 bg-white border border-slate-200 rounded-lg shadow-2xl max-h-60 overflow-y-auto z-50 divide-y divide-slate-100">
          </div>
        </div>

        <!-- Slider de Raio em Quilômetros -->
        <div class="bg-white p-3 rounded-lg border border-slate-200/90 shadow-sm">
          <div class="flex items-center justify-between text-xs font-semibold text-slate-700 mb-1.5">
            <span class="flex items-center gap-1.5">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              Raio de Abrangência:
            </span>
            <span id="valorRaioTexto" class="text-sm font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
              100 km
            </span>
          </div>
          <input 
            type="range" 
            id="sliderRaio" 
            min="10" 
            max="500" 
            step="10" 
            value="100" 
            class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-600"
          >
          <div class="flex justify-between text-[10px] text-slate-400 mt-1">
            <span>10 km</span>
            <span>250 km</span>
            <span>500 km</span>
          </div>
        </div>

      </div>

      <!-- Barra de Status / Contagem de Resultados -->
      <div class="px-4 py-2.5 bg-slate-100 border-b border-slate-200 flex items-center justify-between text-xs text-slate-600">
        <span id="labelStatus" class="font-medium">Carregando hotéis...</span>
        <span id="badgeFiltroAtivo" class="hidden text-[11px] bg-slate-200 text-slate-700 font-semibold px-2 py-0.5 rounded-full">
          Filtro Ativo
        </span>
      </div>

      <!-- Lista Rolável de Cards dos Resultados -->
      <div id="listaResultados" class="flex-1 overflow-y-auto p-3 space-y-2.5">
        <!-- Cards inseridos dinamicamente pelo JavaScript -->
      </div>

    </aside>

    <!-- Área do Mapa Leaflet -->
    <main class="flex-1 h-full relative">
      <div id="map" class="w-full h-full z-10"></div>

      <!-- Indicador Flutuante de Coordenadas de Referência -->
      <div id="boxPontoReferencia" class="hidden absolute top-4 right-4 bg-white/95 backdrop-blur-md border border-slate-200 rounded-xl p-3 shadow-lg z-20 max-w-sm text-xs">
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="font-semibold text-slate-900" id="nomeRefMunicipio">Município de Referência</p>
            <p class="text-slate-500 text-[11px] mt-0.5" id="coordsRef">Lat: --, Lon: --</p>
          </div>
          <button id="btnFecharRef" class="text-slate-400 hover:text-slate-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>
    </main>

  </div>

  <script>
    // Estado Global da Aplicação
    const state = {
      pontoCentral: null, // { lat: number, lon: number, nome: string }
      raioKm: 100,
      todosHoteis: [],
      hoteisFiltrados: [],
      marcadoresHoteis: [],
      marcadorCentro: null,
      circuloRaio: null
    };

    // Inicialização do Mapa Leaflet
    const map = L.map('map', {
      center: [-14.235, -51.9253], // Centro do Brasil
      zoom: 4,
      zoomControl: false
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Camada Base OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    // Ícones personalizados
    const iconeHotel = L.divIcon({
      className: 'custom-hotel-marker',
      html: `
        <div class="w-8 h-8 rounded-full bg-emerald-600 border-2 border-white shadow-lg flex items-center justify-center text-white transform hover:scale-110 transition cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
        </div>
      `,
      iconSize: [32, 32],
      iconAnchor: [16, 16],
      popupAnchor: [0, -18]
    });

    const iconeCentro = L.divIcon({
      className: 'custom-center-marker',
      html: `
        <div class="w-7 h-7 rounded-full bg-rose-600 border-2 border-white shadow-xl flex items-center justify-center text-white animate-bounce">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
          </svg>
        </div>
      `,
      iconSize: [28, 28],
      iconAnchor: [14, 28],
      popupAnchor: [0, -28]
    });

    // Elementos da Interface
    const inputMunicipio = document.getElementById('inputMunicipio');
    const btnLimparBusca = document.getElementById('btnLimparBusca');
    const listaSugestoes = document.getElementById('listaSugestoes');
    const sliderRaio = document.getElementById('sliderRaio');
    const valorRaioTexto = document.getElementById('valorRaioTexto');
    const listaResultados = document.getElementById('listaResultados');
    const labelStatus = document.getElementById('labelStatus');
    const badgeFiltroAtivo = document.getElementById('badgeFiltroAtivo');
    const btnVerTodos = document.getElementById('btnVerTodos');
    const btnMinhaLocalizacao = document.getElementById('btnMinhaLocalizacao');
    const boxPontoReferencia = document.getElementById('boxPontoReferencia');
    const nomeRefMunicipio = document.getElementById('nomeRefMunicipio');
    const coordsRef = document.getElementById('coordsRef');
    const btnFecharRef = document.getElementById('btnFecharRef');

    // Funções Utilitárias para Atributos dos Hotéis
    function obterPropriedade(obj, campos) {
      for (const campo of campos) {
        for (const chave in obj) {
          if (chave.toLowerCase() === campo.toLowerCase() && obj[chave] !== null && obj[chave] !== '') {
            return obj[chave];
          }
        }
      }
      return null;
    }

    function obterNomeHotel(hotel) {
      return obterPropriedade(hotel, ['nome', 'hotel', 'denominacao', 'estabelecimento', 'nome_hotel', 'ht']) || 'Hotel de Trânsito';
    }

    function obterCidadeUf(hotel) {
      const cidade = obterPropriedade(hotel, ['municipio', 'cidade', 'localidade', 'cid']) || '';
      const uf = obterPropriedade(hotel, ['uf', 'estado', 'sigla_uf']) || '';
      if (cidade && uf) return `${cidade} - ${uf}`;
      return cidade || uf || 'Localidade não informada';
    }

    function obterForca(hotel) {
      return obterPropriedade(hotel, ['forca', 'forca_armada', 'comando', 'organizacao', 'om']) || 'Forças Armadas';
    }

    // Carregar dados da API
    async function carregarHoteis(lat = null, lon = null, raio = null) {
      labelStatus.textContent = "Buscando dados no GeoPackage...";
      listaResultados.innerHTML = `
        <div class="flex flex-col items-center justify-center p-8 text-slate-400">
          <svg class="animate-spin h-8 w-8 text-emerald-600 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-xs">Consultando banco de dados...</span>
        </div>
      `;

      try {
        let url = '/api/hoteis';
        const params = new URLSearchParams();
        if (lat !== null && lon !== null) {
          params.append('lat', lat);
          params.append('lon', lon);
          if (raio) params.append('raio_km', raio);
        }

        if ([...params.keys()].length > 0) {
          url += `?${params.toString()}`;
        }

        const resposta = await fetch(url);
        if (!resposta.ok) throw new Error("Falha ao comunicar com a API");
        const dados = await resposta.json();

        state.hoteisFiltrados = dados.hoteis || [];
        renderizarLista(state.hoteisFiltrados);
        atualizarMarcadoresMapa(state.hoteisFiltrados);

        if (lat !== null && lon !== null) {
          badgeFiltroAtivo.classList.remove('hidden');
          labelStatus.textContent = `${state.hoteisFiltrados.length} hotéis em um raio de ${raio} km`;
        } else {
          badgeFiltroAtivo.classList.add('hidden');
          labelStatus.textContent = `Total de ${state.hoteisFiltrados.length} hotéis cadastrados`;
        }

      } catch (erro) {
        console.error("Erro ao carregar hotéis:", erro);
        labelStatus.textContent = "Erro ao carregar dados";
        listaResultados.innerHTML = `
          <div class="p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 text-xs text-center">
            Não foi possível carregar os hotéis do arquivo GeoPackage. Verifique se o servidor está ativo.
          </div>
        `;
      }
    }

    // Renderizar Cards na Sidebar
    function renderizarLista(hoteis) {
      if (!hoteis || hoteis.length === 0) {
        listaResultados.innerHTML = `
          <div class="text-center py-10 px-4">
            <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mx-auto text-slate-400 mb-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <p class="text-sm font-semibold text-slate-700">Nenhum hotel encontrado</p>
            <p class="text-xs text-slate-500 mt-1">Tente aumentar o raio de abrangência ou alterar o município pesquisado.</p>
          </div>
        `;
        return;
      }

      listaResultados.innerHTML = '';
      hoteis.forEach((hotel, idx) => {
        const nome = obterNomeHotel(hotel);
        const cidadeUf = obterCidadeUf(hotel);
        const forca = obterForca(hotel);
        const distancia = hotel.distancia_km !== undefined ? `${hotel.distancia_km} km` : null;
        const lat = hotel.latitude;
        const lon = hotel.longitude;

        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-xl border border-slate-200/80 hover:border-emerald-500/70 hover:shadow-md transition cursor-pointer group";
        
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <h3 class="text-sm font-semibold text-slate-800 group-hover:text-emerald-700 transition line-clamp-1">
              ${nome}
            </h3>
            ${distancia ? `
              <span class="shrink-0 bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-bold px-2 py-0.5 rounded-full">
                ${distancia}
              </span>
            ` : ''}
          </div>

          <div class="mt-1.5 flex items-center gap-1.5 text-xs text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span class="truncate">${cidadeUf}</span>
          </div>

          <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
            <span class="inline-block bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium truncate max-w-[200px]">
              ${forca}
            </span>
            <button class="text-emerald-600 hover:text-emerald-700 font-medium flex items-center gap-1 group-hover:underline">
              Ver no mapa
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>
        `;

        card.addEventListener('click', () => {
          if (lat !== null && lon !== null) {
            map.flyTo([lat, lon], 14, { duration: 1.2 });
            const marcador = state.marcadoresHoteis.find(m => m._hotelRef === hotel);
            if (marcador) marcador.openPopup();
          }
        });

        listaResultados.appendChild(card);
      });
    }

    // Criar Popup formatado
    function criarConteudoPopup(hotel) {
      const nome = obterNomeHotel(hotel);
      const cidadeUf = obterCidadeUf(hotel);
      const forca = obterForca(hotel);
      const distancia = hotel.distancia_km !== undefined ? `${hotel.distancia_km} km` : null;

      let linhasExtras = '';
      for (const [chave, valor] of Object.entries(hotel)) {
        const chaveMin = chave.toLowerCase();
        if (['latitude', 'longitude', 'distancia_km'].includes(chaveMin)) continue;
        if (valor !== null && valor !== '') {
          linhasExtras += `
            <div class="flex justify-between py-1 border-b border-slate-100 text-[11px]">
              <span class="text-slate-400 font-medium capitalize">${chave.replace(/_/g, ' ')}:</span>
              <span class="text-slate-700 font-semibold text-right pl-2 truncate max-w-[180px]">${valor}</span>
            </div>
          `;
        }
      }

      return `
        <div class="p-4 max-w-xs font-sans">
          <div class="flex items-start justify-between gap-2 mb-2">
            <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded uppercase tracking-wider">
              ${forca}
            </span>
            ${distancia ? `
              <span class="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                ${distancia}
              </span>
            ` : ''}
          </div>
          <h4 class="text-sm font-bold text-slate-900 leading-snug mb-1">${nome}</h4>
          <p class="text-xs text-slate-500 mb-3">${cidadeUf}</p>

          <div class="max-h-40 overflow-y-auto pr-1">
            ${linhasExtras}
          </div>

          <div class="mt-3 pt-2 text-center">
            <a 
              href="https://www.google.com/maps/search/?api=1&query=${hotel.latitude},${hotel.longitude}" 
              target="_blank" 
              class="inline-flex items-center gap-1.5 text-xs text-white bg-slate-900 hover:bg-slate-800 px-3 py-1.5 rounded-lg transition shadow-sm"
            >
              Abrir no Google Maps
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
              </svg>
            </a>
          </div>
        </div>
      `;
    }

    // Atualizar Marcadores no Mapa Leaflet
    function atualizarMarcadoresMapa(hoteis) {
      // Limpa marcadores anteriores
      state.marcadoresHoteis.forEach(m => map.removeLayer(m));
      state.marcadoresHoteis = [];

      const limites = [];

      hoteis.forEach(hotel => {
        if (hotel.latitude !== null && hotel.longitude !== null) {
          const lat = hotel.latitude;
          const lon = hotel.longitude;
          limites.push([lat, lon]);

          const marcador = L.marker([lat, lon], { icon: iconeHotel })
            .bindPopup(criarConteudoPopup(hotel));
          
          marcador._hotelRef = hotel;
          marcador.addTo(map);
          state.marcadoresHoteis.push(marcador);
        }
      });

      // Inclui o ponto central nos limites se houver
      if (state.pontoCentral) {
        limites.push([state.pontoCentral.lat, state.pontoCentral.lon]);
      }

      if (limites.length > 0 && !state.pontoCentral) {
        map.fitBounds(limites, { padding: [40, 40], maxZoom: 14 });
      }
    }

    // Desenhar Círculo e Marcador do Ponto de Busca
    function atualizarRaioMapa() {
      if (state.circuloRaio) map.removeLayer(state.circuloRaio);
      if (state.marcadorCentro) map.removeLayer(state.marcadorCentro);

      if (!state.pontoCentral) {
        boxPontoReferencia.classList.add('hidden');
        return;
      }

      const { lat, lon, nome } = state.pontoCentral;

      // Círculo com o raio em metros
      state.circuloRaio = L.circle([lat, lon], {
        radius: state.raioKm * 1000,
        color: '#059669',
        fillColor: '#10b981',
        fillOpacity: 0.12,
        weight: 2,
        dashArray: '5, 5'
      }).addTo(map);

      // Marcador no centro da busca
      state.marcadorCentro = L.marker([lat, lon], { icon: iconeCentro })
        .bindPopup(`
          <div class="p-3 text-xs">
            <p class="font-bold text-slate-800">${nome || 'Ponto de Referência'}</p>
            <p class="text-slate-500">Raio de busca: ${state.raioKm} km</p>
          </div>
        `)
        .addTo(map);

      // Atualiza card flutuante no mapa
      nomeRefMunicipio.textContent = nome || 'Referência Selecionada';
      coordsRef.textContent = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
      boxPontoReferencia.classList.remove('hidden');

      // Ajusta zoom para enquadrar o círculo
      map.fitBounds(state.circuloRaio.getBounds(), { padding: [30, 30] });
    }

    // Aplicar Filtro Geográfico Completo
    function aplicarFiltroGeografico() {
      if (state.pontoCentral) {
        atualizarRaioMapa();
        carregarHoteis(state.pontoCentral.lat, state.pontoCentral.lon, state.raioKm);
      } else {
        carregarHoteis();
      }
    }

    // Slider de Raio
    sliderRaio.addEventListener('input', (e) => {
      state.raioKm = parseInt(e.target.value, 10);
      valorRaioTexto.textContent = `${state.raioKm} km`;
    });

    sliderRaio.addEventListener('change', () => {
      if (state.pontoCentral) {
        aplicarFiltroGeografico();
      }
    });

    // Geocodificação Nominatim (OpenStreetMap) com Debounce
    let timerBusca = null;
    inputMunicipio.addEventListener('input', (e) => {
      const termo = e.target.value.trim();
      btnLimparBusca.classList.toggle('hidden', termo.length === 0);

      clearTimeout(timerBusca);
      if (termo.length < 3) {
        listaSugestoes.classList.add('hidden');
        return;
      }

      timerBusca = setTimeout(async () => {
        try {
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(termo)}&countrycodes=br&limit=5`;
          const resp = await fetch(url, {
            headers: { 'Accept-Language': 'pt-BR' }
          });
          const resultados = await resp.json();

          if (resultados && resultados.length > 0) {
            listaSugestoes.innerHTML = '';
            resultados.forEach(item => {
              const itemDiv = document.createElement('div');
              itemDiv.className = 'p-2.5 text-xs text-slate-700 hover:bg-emerald-50 hover:text-emerald-900 cursor-pointer flex items-center gap-2 transition';
              itemDiv.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span class="truncate">${item.display_name}</span>
              `;

              itemDiv.addEventListener('click', () => {
                inputMunicipio.value = item.display_name.split(',')[0];
                listaSugestoes.classList.add('hidden');
                
                state.pontoCentral = {
                  lat: parseFloat(item.lat),
                  lon: parseFloat(item.lon),
                  nome: item.display_name.split(',')[0]
                };

                aplicarFiltroGeografico();
              });

              listaSugestoes.appendChild(itemDiv);
            });
            listaSugestoes.classList.remove('hidden');
          } else {
            listaSugestoes.classList.add('hidden');
          }
        } catch (err) {
          console.error("Erro na busca de municípios:", err);
        }
      }, 350);
    });

    // Fechar sugestões ao clicar fora
    document.addEventListener('click', (e) => {
      if (!inputMunicipio.contains(e.target) && !listaSugestoes.contains(e.target)) {
        listaSugestoes.classList.add('hidden');
      }
    });

    // Limpar busca
    btnLimparBusca.addEventListener('click', () => {
      inputMunicipio.value = '';
      btnLimparBusca.classList.add('hidden');
      listaSugestoes.classList.add('hidden');
      state.pontoCentral = null;
      atualizarRaioMapa();
      carregarHoteis();
    });

    btnFecharRef.addEventListener('click', () => {
      state.pontoCentral = null;
      inputMunicipio.value = '';
      btnLimparBusca.classList.add('hidden');
      atualizarRaioMapa();
      carregarHoteis();
    });

    btnVerTodos.addEventListener('click', () => {
      state.pontoCentral = null;
      inputMunicipio.value = '';
      btnLimparBusca.classList.add('hidden');
      atualizarRaioMapa();
      carregarHoteis();
    });

    // Obter Localização do Navegador
    btnMinhaLocalizacao.addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert("A geolocalização não é suportada pelo seu navegador.");
        return;
      }

      btnMinhaLocalizacao.disabled = true;
      btnMinhaLocalizacao.innerHTML = `
        <svg class="animate-spin h-3.5 w-3.5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Localizando...
      `;

      navigator.geolocation.getCurrentPosition(
        (posicao) => {
          btnMinhaLocalizacao.disabled = false;
          btnMinhaLocalizacao.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            Meu Local
          `;

          state.pontoCentral = {
            lat: posicao.coords.latitude,
            lon: posicao.coords.longitude,
            nome: 'Minha Localização Atual'
          };
          inputMunicipio.value = 'Minha Localização Atual';
          btnLimparBusca.classList.remove('hidden');

          aplicarFiltroGeografico();
        },
        (erro) => {
          btnMinhaLocalizacao.disabled = false;
          btnMinhaLocalizacao.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            Meu Local
          `;
          alert("Não foi possível obter sua localização. Permita o acesso nas configurações do navegador.");
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    // Clique direto no mapa para definir referência
    map.on('click', (e) => {
      state.pontoCentral = {
        lat: e.latlng.lat,
        lon: e.latlng.lng,
        nome: `Ponto no Mapa (${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)})`
      };
      inputMunicipio.value = state.pontoCentral.nome;
      btnLimparBusca.classList.remove('hidden');
      aplicarFiltroGeografico();
    });

    // Carga Inicial dos Dados
    carregarHoteis();
  </script>
</body>
</html>
